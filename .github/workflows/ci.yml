name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the YAML parses
        run: python3 -c 'import yaml,sys;[yaml.safe_load(open(f)) for f in sys.argv[1:]]' action.yml .github/workflows/*.yml
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check dist is up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            git status --porcelain dist
            echo "dist/ is out of date: run npm run build and commit"
            exit 1
          fi
